<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage | Gender Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            /* Emerald Green */
            --secondary: #3b82f6;
            /* Blue */
            --accent: #f59e0b;
            /* Amber */
            --background: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
        }

        .container {
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        input,
        select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        #result-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        #result-modal.show {
            opacity: 1;
            pointer-events: all;
        }

        .result-content {
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        #result-modal.show .result-content {
            transform: translateY(0);
        }

        .gender-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Identity AI</h1>
                <p class="subtitle">Classify gender based on profile data.</p>
            </div>

            <form id="classification-form">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" placeholder="e.g. 25" min="0" max="120" required>
                </div>

                <div class="form-group">
                    <label>Company</label>
                    <select name="company" required>
                        <option value="" disabled selected>Select Company</option>
                        <option value="Google">Google</option>
                        <option value="ABC Pharma">ABC Pharma</option>
                        <option value="Eye">Eye</option>
                        <option value="Theatrelab">Theatrelab</option>
                    </select>
                </div>

                <button type="submit">Classify Gender</button>
            </form>

            <div id="result-modal">
                <div class="result-content">
                    <span class="gender-icon" id="result-icon">👤</span>
                    <h2 id="result-text" style="font-size: 2.5rem; margin-bottom: 0.5rem; color: white;">Unknown</h2>
                    <p style="color: var(--text-secondary); margin-bottom: 2rem;">Confidence: High</p>
                    <button type="button" onclick="closeModal()"
                        style="background: rgba(255,255,255,0.1); width: auto; padding: 0.8rem 2rem;">Try Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('result-modal');
        const resultText = document.getElementById('result-text');
        const resultIcon = document.getElementById('result-icon');

        function closeModal() {
            modal.classList.remove('show');
            document.getElementById('classification-form').reset();
        }

        document.getElementById('classification-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = 'Analyzing...';

            const form = e.target;
            // Convert Age to Number
            const formData = new FormData(form);
            const data = {
                name: formData.get('name'),
                age: parseInt(formData.get('age')),
                company: formData.get('company')
            };

            try {
                const response = await fetch('/classify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.error) {
                    alert('Error: ' + result.error);
                } else {
                    // Show Result
                    let gender = result.gender;
                    // Capitalize
                    if (gender) gender = gender.charAt(0).toUpperCase() + gender.slice(1);

                    resultText.innerText = gender;
                    if (gender.toLowerCase() === 'male') resultIcon.innerText = '👨';
                    else if (gender.toLowerCase() === 'female') resultIcon.innerText = '👩';
                    else resultIcon.innerText = '👤';

                    modal.classList.add('show');
                }
            } catch (err) {
                console.error(err);
                alert('Failed to connect to server.');
            } finally {
                btn.innerText = originalText;
            }
        });
    </script>
</body>

</html>
